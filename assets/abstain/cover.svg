<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="AbstainBench: answer versus abstain">
  <rect width="1600" height="900" fill="#EBE4D6"/>
  <rect x="80" y="120" width="680" height="660" rx="18" fill="#FCFAF6" stroke="#2F4A3C" stroke-opacity="0.18"/>
  <text x="120" y="200" font-family="Georgia, serif" font-size="42" fill="#2F4A3C">Answer</text>
  <text x="120" y="280" font-family="ui-sans-serif, system-ui" font-size="28" fill="#4A453E">When the evidence holds.</text>
  <rect x="120" y="340" width="560" height="16" rx="8" fill="#2F4A3C" opacity="0.85"/>
  <rect x="120" y="380" width="420" height="16" rx="8" fill="#2F4A3C" opacity="0.45"/>
  <rect x="120" y="420" width="490" height="16" rx="8" fill="#2F4A3C" opacity="0.25"/>
  <rect x="840" y="120" width="680" height="660" rx="18" fill="#2F4A3C"/>
  <text x="880" y="200" font-family="Georgia, serif" font-size="42" fill="#F4EFE6">Abstain</text>
  <text x="880" y="280" font-family="ui-sans-serif, system-ui" font-size="28" fill="#F4EFE6" opacity="0.8">When it does not.</text>
  <text x="880" y="480" font-family="ui-monospace, monospace" font-size="36" fill="#A67C4E">I don't know.</text>
</svg>
