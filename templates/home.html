<main id="main">
  <section class="hero" id="top" aria-label="Suhas Beemineni">
    <div class="hero-monogram" aria-hidden="true">sb</div>
    <div class="location">
      <svg class="location-shape" viewBox="0 0 300 120" aria-hidden="true" focusable="false"><path fill-rule="evenodd" d="M0 0H240a60 60 0 0 1 0 120H0Z M240 18a42 42 0 1 0 0 84a42 42 0 1 0 0-84Z"></path></svg>
      <span class="location-label">Located<br>in<br>California</span>
      <span class="location-orb" aria-hidden="true">
        <svg class="location-globe" viewBox="0 0 100 100" focusable="false">
          <defs><clipPath id="globe-window"><circle cx="50" cy="50" r="47"></circle></clipPath></defs>
          <g class="globe-sphere">
            <circle class="globe-wire" cx="50" cy="50" r="47"></circle>
            <g clip-path="url(#globe-window)">
              <ellipse class="globe-wire globe-meridian" cx="50" cy="50" rx="47" ry="47"></ellipse>
              <ellipse class="globe-wire globe-meridian" cx="50" cy="50" rx="47" ry="47"></ellipse>
              <ellipse class="globe-wire globe-meridian" cx="50" cy="50" rx="47" ry="47"></ellipse>
              <ellipse class="globe-wire" cx="50" cy="50" rx="75" ry="27.5"></ellipse>
              <path class="globe-wire" d="M-25 50H125"></path>
            </g>
          </g>
        </svg>
      </span>
    </div>
    <div class="hero-role"><svg class="hero-arrow" viewBox="0 0 32 32" fill="none" aria-hidden="true" focusable="false"><path d="M6 6L26 26M26 6V26H6" stroke="currentColor" stroke-width="1.5"></path></svg><p>Student &amp;<br>researcher</p></div>
    <h1 class="sr-only">Suhas Beemineni</h1>
    <div class="name-marquee" aria-hidden="true"><div class="name-track"><span>Suhas Beemineni —&nbsp;</span><span>Suhas Beemineni —&nbsp;</span></div></div>
    <a class="hero-scroll" href="#work" aria-label="View work">↓</a>
  </section>

  <section class="introduction wrap" id="about" aria-labelledby="about-title">
    <h2 id="about-title" class="flow-heading" data-flow-heading><span class="flow-line"><span>I work on AI,</span></span> <span class="flow-line"><span>robots, and navigation.</span></span></h2>
    <div class="intro-side"><p>Sophomore at River Islands High School in California.</p><div class="intro-circle-wrap"><a class="circle-button liquid magnetic" href="about.html" data-transition-title="About"><span class="button-fill" aria-hidden="true"></span><span class="button-label">About me</span></a></div></div>
  </section>

  {{featured_work}}
  {{evidence_gallery}}
  <div class="more-work wrap"><a class="more-work-link liquid magnetic" href="work.html" data-transition-title="Work"><span class="button-fill" aria-hidden="true"></span><span class="button-label">All work<sup>{{work_count}}</sup></span></a></div>
  {{recognition}}
</main>
