<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portfolio review</title><style>body{margin:20px;background:#dce0e2;font:14px Arial;color:#242a2e}label{margin-right:18px}select,button{padding:8px;margin:8px}iframe{border:0;display:block;margin:10px auto;background:#f3f4f4;width:390px;height:844px}output{display:block;padding:10px;white-space:pre-wrap}</style></head><body><label>Viewport<select id="width"><option>320</option><option selected>390</option><option>768</option><option>1024</option><option>1280</option></select></label><label>Page<select id="page"><option value="index.html">Home</option><option value="work/aegisland.html">AegisLand</option><option value="work/voyager.html">Voyager</option><option value="work/abstainbench.html">AbstainBench</option><option value="resume.html">Résumé</option><option value="work/echo-field.html">ECHO / FIELD</option></select></label><button id="inspect">Check layout</button><output id="result"></output><iframe id="preview" src="index.html" title="Portfolio at selected viewport"></iframe><script>const f=document.getElementById("preview");document.getElementById("width").onchange=e=>f.style.width=e.target.value+"px";document.getElementById("page").onchange=e=>f.src=e.target.value;document.getElementById("inspect").onclick=async()=>{const d=f.contentDocument;await d.fonts.ready;const broken=[...d.images].filter(x=>x.complete&&!x.naturalWidth).map(x=>x.getAttribute("src"));const overflow=[...d.body.querySelectorAll("*")].filter(x=>{const r=x.getBoundingClientRect();return r.width>0&&(r.right>d.documentElement.clientWidth+1||r.left < -1)&&getComputedStyle(x).position!=="fixed"}).map(x=>x.tagName+"."+x.className).slice(0,10);document.getElementById("result").textContent=JSON.stringify({viewport:f.contentWindow.innerWidth,width:d.documentElement.clientWidth,scrollWidth:d.documentElement.scrollWidth,broken,overflow,h1:d.querySelectorAll("h1").length},null,2)};</script></body></html>
